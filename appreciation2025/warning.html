<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>SECURITY WARNING</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #b30000;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .warning-container {
      max-width: 600px;
      padding: 30px;
      opacity: 0;
      transform: scale(0.96);
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .icon {
      font-size: 110px;
      margin-bottom: 20px;
      animation: blink 1s infinite, shake 0.5s ease-in-out infinite alternate;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    .dear {
      font-size: 18px;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .hint {
      font-size: 14px;
      opacity: 0.7;
      margin-top: 20px;
    }

    @keyframes blink {
      0%   { opacity: 1; }
      50%  { opacity: 0.25; }
      100% { opacity: 1; }
    }

    @keyframes shake {
      from { transform: translateX(-4px); }
      to   { transform: translateX(4px); }
    }

    @media (max-width: 480px) {
      .icon {
        font-size: 90px;
      }

      h1 {
        font-size: 26px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- ALARM SOUND -->
  <audio id="alarmSound" loop preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" type="audio/mpeg">
  </audio>

  <div class="warning-container">
    <div class="icon">⚠️</div>

    <div class="dear" id="dearText">Dear</div>

    <h1>PERINGATAN KEAMANAN</h1>

    <p>
      Hayo jangan klik link sembarangan.<br>
      Ambil training <strong>cybersecurity</strong> lagi.
    </p>

  </div>

  <script>
    const alarm = document.getElementById('alarmSound');
    const dearText = document.getElementById('dearText');

    // Read name from URL
    const params = new URLSearchParams(window.location.search);
    let name = params.get('name');

    if (!name) {
      name = 'Orang Penasaran';
    }

    dearText.textContent = `Dear ${decodeURIComponent(name)}`;

    function enterFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }

    function startPrank() {
      // Fade-in alarm volume
      alarm.volume = 0;
      alarm.play().catch(() => {});

      let vol = 0;
      const fade = setInterval(() => {
        vol += 0.05;
        if (vol >= 1) {
          vol = 1;
          clearInterval(fade);
        }
        alarm.volume = vol;
      }, 100);

      enterFullscreen();

      document.removeEventListener('click', startPrank);
      document.removeEventListener('keydown', startPrank);
      document.removeEventListener('touchstart', startPrank);
    }

    // Trigger on first interaction
    document.addEventListener('click', startPrank);
    document.addEventListener('keydown', startPrank);
    document.addEventListener('touchstart', startPrank);

    // If user leaves tab, resume chaos 😈
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        alarm.play().catch(() => {});
        enterFullscreen();
      }
    });
  </script>

</body>
</html>
