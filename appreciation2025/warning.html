<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>WARNING</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      background: #c40000;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .box {
      max-width: 500px;
    }

    .icon {
      font-size: 100px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>

<audio id="alarm" loop>
   <source src="https://assets.mixkit.co/active_storage/sfx/995/995-preview.mp3" type="audio/mpeg">
</audio>

<div class="box">
  <div class="icon">⚠️</div>
  <h1>PERINGATAN</h1>
  <p>
    Hayo jangan klik link sembarangan,<br>
    ambil training <b>cybersecurity</b> lagi.
  </p>
</div>

<script>
  function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
  }

  document.addEventListener('click', () => {
    goFullscreen();
    document.getElementById('alarm').play();
  }, { once: true });

  // Try auto fullscreen (some browsers block it)
  setTimeout(goFullscreen, 500);
</script>

</body>
</html>
