<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Terima Kasih 2025</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Playfair Display', serif;
      background: #fdfcf8;
      color: #6b5b2d;
      overflow: hidden;
    }

    /* LOADING SCREEN */
    #loading {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #e5d9a4;
      border-top: 4px solid #d4af37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* MAIN CONTENT */
    #content {
      display: none;
      min-height: 100vh;
      background:
        linear-gradient(rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
        url("assets/images/bg.jpg");
      background-size: cover;
      background-position: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.9);
      border: 2px solid #d4af37;
      padding: 50px 30px;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      color: #bfa23a;
    }

    .divider {
      height: 2px;
      width: 120px;
      background: linear-gradient(to right, transparent, #d4af37, transparent);
      margin: 30px auto;
    }

    .btn {
      margin-top: 30px;
      padding: 14px 30px;
      background: linear-gradient(135deg, #d4af37, #f5e7a1);
      border-radius: 30px;
      color: #5a4a1f;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="loader"></div>
  <p>Mempersiapkan undangan...</p>
</div>

<!-- AUDIO -->
<audio id="bgMusic" loop>
  <source src="assets/music/wedding.mp3" type="audio/mpeg">
</audio>

<!-- CONTENT -->
<div id="content">
  <div class="container">
    <div class="card">
      <h1>Terima Kasih</h1>
      <p>Atas kerjasamanya di tahun 2025</p>

      <div class="divider"></div>

      <p>
        “Kerja sama yang hebat lahir dari kepercayaan dan konsistensi.”
      </p>

      <p>
        “Kesuksesan bukan hasil satu orang, tapi tim yang solid.”
      </p>

      <div class="divider"></div>

      <a href="warning.html" class="btn">
        🎁 Click Here to Get a Gift
      </a>
    </div>
  </div>
</div>

<script>
  // Fake loading
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';
  }, 2500);

  // Autoplay after interaction
  document.addEventListener('click', () => {
    document.getElementById('bgMusic').play();
  }, { once: true });
</script>

</body>
</html>
